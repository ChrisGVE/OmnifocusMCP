name: ci

on:
  push:
  pull_request:

jobs:
  rust-checks:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo fmt
        run: cd rust && cargo fmt --check

      - name: cargo clippy
        run: cd rust && cargo clippy -- -D warnings

      - name: cargo test
        run: cd rust && cargo test
