[package]
name = "omnifocus-mcp"
version = "2.0.0"
edition = "2021"
license = "MIT"

[dependencies]
rmcp = { version = "0.17", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
subtle = "2"
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }

[features]
integration = []

