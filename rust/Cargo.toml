[package]
name = "omnifocus-mcp"
version = "2.0.0"
edition = "2021"
license = "MIT"

[dependencies]
rmcp = { version = "0.17", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
integration = []

